# Local golden path: the API with the standard opt-in stack (Postgres + Redis)
# enabled via environment. The template's code defaults keep every capability
# off; this file is the worked example of turning the standard stack on.
#
#   make docker-run              # api + postgres + redis
#   make docker-run-langfuse     # + the self-hosted Langfuse overlay
#     (docker-compose.langfuse.yaml layers the tracing stack on top)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-platform:local
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      AUTH_BEARER_TOKEN: ${AUTH_BEARER_TOKEN:-change-me-local-bearer-token}
      # Standard stack: opt into the database + redis capabilities.
      DATABASE_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-platform

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ai-platform

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ai-platform

networks:
  ai-platform:

volumes:
  postgres-data:
