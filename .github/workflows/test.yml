name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Run tests
        run: uv run --all-extras pytest -q
      - name: Eval gate (deterministic cases — judge cases skip without JUDGE_CHAT_MODEL)
        run: uv run --all-extras python -m scripts.run_eval --min-score 0.8
